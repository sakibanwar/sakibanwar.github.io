# Pages CMS configuration (https://pagescms.org).
# This file defines the editing forms you see at https://app.pagescms.org.
# Every save rebuilds BOTH the website and the PDF CV (about 3 minutes).

media:
  input: assets/uploads
  output: /assets/uploads

content:
  - name: research
    label: Research & papers
    type: file
    path: _data/research.yml
    format: yaml
    fields:
      - name: interests
        label: Research interests
        description: Tags in the Research page banner (website only).
        type: string
        list: true
      - name: papers
        label: Papers
        description: >-
          Used on the Research page AND in the PDF CV. Status decides the section.
          Drag papers to reorder them.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title} ({status})"
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: status
            label: Status
            type: select
            required: true
            options:
              values:
                - name: published
                  label: Published
                - name: working
                  label: Working paper
                - name: progress
                  label: Work in progress
          - name: coauthors
            label: Co-authors
            description: Full names. The CV shortens them to initials (K. Georgalos) automatically.
            type: string
            list: true
          - name: url
            label: Main link
            description: Journal page or DOI. The website shows a Journal/Paper button; the CV prints [Link].
            type: string
          - name: journal
            label: Journal
            description: For published papers, e.g. Experimental Economics
            type: string
          - name: details
            label: Volume, pages, year
            description: e.g. 27, 820–853 (2024)
            type: string
          - name: note
            label: Status note
            description: e.g. **Submitted** or **Reject and Resubmit** at ***Experimental Economics*** (**bold**, *italic*)
            type: string
          - name: ranking
            label: Journal ranking (PDF CV only)
            description: e.g. ABS/AJG 3, CNRS 1
            type: string
          - name: links
            label: Other links
            description: arXiv, SSRN, slides, data, pre-registration…
            type: object
            list: true
            fields:
              - name: label
                label: Button text
                type: string
              - name: url
                label: Link
                type: string
              - name: hide_from_cv
                label: Hide from PDF CV
                type: boolean
              - name: hide_from_website
                label: Hide from website
                type: boolean
          - name: pdf
            label: PDF upload (website)
            description: Optional. Adds a PDF button on the website.
            type: file
            options:
              extensions: [pdf]
          - name: abstract
            label: Abstract (website)
            type: text
          - name: hide_from_cv
            label: Hide from PDF CV
            type: boolean
          - name: hide_from_website
            label: Hide from website
            type: boolean

  - name: talks
    label: Talks & seminars
    type: file
    path: _data/talks.yml
    format: yaml
    fields:
      - name: talks
        label: Talks
        description: Newest first. Website groups them by year; the CV splits seminars from conferences.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{year} · {event}"
        fields:
          - name: type
            label: Type
            type: select
            required: true
            options:
              values:
                - name: conference
                  label: Conference
                - name: seminar
                  label: Seminar
          - name: year
            label: Year
            type: number
            required: true
          - name: month
            label: Month
            type: select
            options:
              values: [January, February, March, April, May, June, July, August, September, October, November, December]
          - name: event
            label: Event or seminar series
            type: string
            required: true
          - name: location
            label: Location / institution
            type: string
          - name: paper
            label: Paper presented (website)
            type: string
          - name: note
            label: Note (website), e.g. Poster
            type: string
          - name: hide_from_cv
            label: Hide from PDF CV
            type: boolean
          - name: hide_from_website
            label: Hide from website
            type: boolean

  - name: teaching
    label: Teaching
    type: file
    path: _data/teaching.yml
    format: yaml
    fields:
      - name: interests
        label: Teaching interests
        description: Teaching page banner and the CV's Teaching Interests line.
        type: string
        list: true
      - name: qualifications
        label: Qualifications and training
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            type: string
            required: true
          - name: organisation
            type: string
          - name: date
            type: string
          - name: url
            label: Link (e.g. certificate)
            type: string
          - name: plain
            label: Normal weight (not bold)
            type: boolean
          - name: hide_from_cv
            label: Hide from PDF CV
            type: boolean
          - name: hide_from_website
            label: Hide from website
            type: boolean
      - name: textbooks_intro
        label: Textbooks introduction (website)
        type: text
      - name: textbooks
        label: Open-access textbooks
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            type: string
            required: true
          - name: url
            label: Link
            type: string
          - name: cv_note
            label: CV note, e.g. Jupyter Book (open access)
            type: string
          - name: description
            label: Description (website)
            type: text
          - name: hide_from_cv
            label: Hide from PDF CV
            type: boolean
          - name: hide_from_website
            label: Hide from website
            type: boolean
      - name: places
        label: Where you teach / taught
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Institution
            type: string
            required: true
          - name: note
            label: Note after the name (PDF CV only)
            description: e.g. Senior Lecturer, Sep 2026–Present; classes of 15–30
            type: string
          - name: compact
            label: One-line module list in the CV
            type: boolean
          - name: groups
            label: Module lists
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: Heading, e.g. Current Modules
                type: string
              - name: note
                label: Note after the heading
                description: e.g. 2026–27, module leader for all eight. PDF CV only unless ticked below.
                type: string
              - name: note_on_website
                label: Also show this note on the website
                type: boolean
              - name: modules
                label: Modules
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{name}"
                fields:
                  - name: name
                    label: Module
                    type: string
                    required: true
                  - name: level
                    label: Level, e.g. 2nd Year
                    type: string
                  - name: note
                    label: Extra note
                    description: Added after the level, e.g. Computer Science students. PDF CV only unless ticked below.
                    type: string
                  - name: note_on_website
                    label: Also show this note on the website
                    type: boolean
                  - name: tools
                    label: Tools, e.g. Python, Colab
                    type: string
                  - name: dates
                    label: Dates, e.g. Aug 2025–Present
                    type: string
                  - name: link_label
                    label: Button text (website), e.g. Python notes
                    type: string
                  - name: link_url
                    label: Button link (website)
                    type: string
                  - name: hide_from_cv
                    label: Hide from PDF CV
                    type: boolean
                  - name: hide_from_website
                    label: Hide from website
                    type: boolean
          - name: footnote
            label: Paragraph after the modules (PDF CV only)
            type: text
          - name: hide_from_cv
            label: Hide from PDF CV
            type: boolean
          - name: hide_from_website
            label: Hide from website
            type: boolean
      - name: outreach
        label: Outreach and public engagement (PDF CV only)
        type: text

  - name: cv
    label: CV sections
    type: file
    path: _data/cv.yml
    format: yaml
    fields:
      - name: sections
        label: Sections
        description: >-
          In the order they appear in the PDF CV and on the website's CV page. Use Entries for
          jobs, degrees, grants; Lines for "Label: text" rows; Text for a paragraph. Research,
          Teaching and Talks fill themselves in from their own forms.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Heading
            type: string
            required: true
          - name: type
            label: Type
            type: select
            required: true
            options:
              values:
                - name: entries
                  label: Entries
                - name: lines
                  label: Lines
                - name: text
                  label: Text
                - name: research
                  label: Research papers (automatic)
                - name: teaching
                  label: Teaching (automatic)
                - name: talks
                  label: Talks (automatic)
          - name: hide_from_cv
            label: Hide from PDF CV
            type: boolean
          - name: hide_from_website
            label: Hide from website
            type: boolean
          - name: entries
            label: Entries (type Entries)
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title} {date}"
            fields:
              - name: title
                type: string
                required: true
              - name: extra
                label: After the title, e.g. (£3,000) or (part-time)
                type: string
              - name: organisation
                type: string
              - name: tag
                label: Small grey note, e.g. Oversee 25+ doctoral students
                type: string
              - name: date
                type: string
              - name: details
                description: Shown under the entry. One line per row. **bold**, *italic*, [link](https://…)
                type: text
              - name: website_details
                label: Extra details (website only)
                type: text
              - name: url
                label: Link
                type: string
              - name: plain
                label: Normal weight (not bold)
                type: boolean
              - name: hide_from_cv
                label: Hide from PDF CV
                type: boolean
              - name: hide_from_website
                label: Hide from website
                type: boolean
          - name: lines
            label: Lines (type Lines)
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - name: label
                type: string
                required: true
              - name: extra
                label: After the label, e.g. (6, Economics)
                type: string
              - name: text
                type: text
              - name: space_before
                label: Extra space before this line (PDF)
                type: boolean
              - name: hide_from_cv
                label: Hide from PDF CV
                type: boolean
              - name: hide_from_website
                label: Hide from website
                type: boolean
          - name: text
            label: Text (type Text)
            type: text
          - name: plain_titles
            label: All entry titles in normal weight
            type: boolean
          - name: bullets
            label: Bulleted lines (PDF)
            type: boolean
          - name: publications_oldest_first
            label: PDF lists publications oldest first (Research section only)
            type: boolean
          - name: needspace
            type: number
            hidden: true

  - name: profile
    label: Profile & contact
    type: file
    path: _data/profile.yml
    format: yaml
    fields:
      - name: name
        label: Name on the website
        type: string
        required: true
      - name: full_name
        label: Full name (PDF CV header)
        type: string
      - name: position
        type: string
      - name: affiliation
        type: string
      - name: photo
        type: image
      - name: email
        label: Work email
        type: string
      - name: email_personal
        label: Personal email (PDF CV only)
        type: string
      - name: phone
        description: UK format, e.g. 01962 675219. The CV shows +44 (0)…
        type: string
      - name: website
        type: string
      - name: linkedin
        label: LinkedIn URL (website)
        type: string
      - name: github
        label: GitHub URL
        type: string
      - name: google_scholar
        label: Google Scholar URL
        type: string
      - name: orcid
        label: ORCID URL
        type: string
      - name: address
        label: Address (website)
        description: One line per row.
        type: text
      - name: cv_location
        label: Location line (PDF CV header)
        type: string
      - name: map_query
        label: Map location (website)
        description: What to search on Google Maps. Leave blank to hide the map.
        type: string
      - name: affiliation_logo
        label: University logo
        type: image
      - name: affiliation_url
        label: University website
        type: string

  - name: home
    label: Home page bio
    type: file
    path: index.md
    format: yaml-frontmatter
    fields:
      - name: layout
        type: string
        hidden: true
      - name: permalink
        type: string
        hidden: true
      - name: body
        label: Bio
        type: rich-text
        options:
          format: markdown
          media: false

  - name: people
    label: Co-author websites
    type: file
    path: _data/people.yml
    format: yaml
    fields:
      - name: people
        label: Co-authors
        description: Names that match a paper's co-author are linked on the website.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Name (exactly as written on papers)
            type: string
            required: true
          - name: url
            label: Website
            type: string
