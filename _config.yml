# ---------------------------------------------------------------------------
# Site-wide settings. You rarely need to touch this file.
# Your actual content lives in the _data/ folder (papers, teaching, talks, CV)
# and in index.md (the bio on the home page).
# ---------------------------------------------------------------------------

title: Sakib Anwar
tagline: Senior Lecturer in Economics, University of Winchester
description: >-
  Sakib Anwar, Senior Lecturer in Economics at the University of Winchester.
  Experimental Economics, Applied Game Theory and Public Economics.
url: "https://sakibanwar.github.io"   # change to https://www.sakibanwar.com once the domain points here
baseurl: ""
lang: en-GB

# Menu at the top of every page (in this order)
nav:
  - title: Home
    url: /
  - title: Research
    url: /research/
  - title: Teaching
    url: /teaching/
  - title: CV
    url: /cv/
  - title: Talks
    url: /talks/

# Used by jekyll-seo-tag for search engines and link previews
author: Sakib Anwar
logo: /assets/img/profile.jpg

# GitHub Pages adds a default theme unless told not to; this site has its own design.
theme: null

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
