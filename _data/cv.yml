# The PDF CV and the website's CV page are both built from this file, in this order.
#
# Section types
#   entries    a list of items: title, extra, organisation, tag, date, details
#   lines      "Label: text" rows (bullets: true puts them in a bulleted list)
#   text       one paragraph
#   research   filled in automatically from _data/research.yml
#   teaching   filled in automatically from _data/teaching.yml
#   talks      filled in automatically from _data/talks.yml
#
# Show / hide
#   hide_from_website: true   PDF only
#   hide_from_cv: true        website only
#   (works on whole sections and on single entries)
#   plain_titles: true        titles in normal weight instead of bold (plain: true for one entry)
#
# Text fields understand **bold**, *italic* and [links](https://example.com).
# "details" can have several lines; each becomes its own line.
# "website_details" is an extra line shown only on the website.
# "needspace" (PDF layout): start a new page if fewer than this many lines are left.
