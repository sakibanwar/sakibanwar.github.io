# Website only: paragraph above the textbook cards.
textbooks_intro: >-
  The following open-access textbooks, built with Jupyter Book, provide step-by-step Python
  tutorials covering data analysis and statistical inference, with executable code examples
  and exercises drawn from economics and business datasets.

textbooks:
  - title: Python for Data Analysis
    url: https://sakibanwar.github.io/python-notes/intro.html
    cv_note: Jupyter Book (open access)
    description: >-
      Companion text for the Data Analytics and Data Analysis modules, covering Python
      fundamentals, pandas, data visualisation, regression, and dashboard creation with
      Streamlit.
  - title: Python for Statistics
    url: https://sakibanwar.github.io/python-notes/stats/intro_stats.html
    cv_note: Jupyter Book (open access)
    description: >-
      Companion text for the Quantitative Methods and Statistics module, with expanded
      coverage of data visualisation, filtering, and a statistics-focused regression case
      study.

